<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — Astrodock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-root: #f4f5f7;
      --bg-surface: #ffffff;
      --bg-input: #f7f8fa;
      --border: #d8dbe0;
      --text-primary: #1a1d23;
      --text-secondary: #5a5f6b;
      --text-muted: #8b919e;
      --accent: #0d9668;
      --accent-dim: rgba(13, 150, 104, 0.08);
      --accent-hover: #0b7f58;
      --danger: #dc2626;
      --danger-dim: rgba(220, 38, 38, 0.07);
      --font-body: 'DM Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --radius: 8px;
      --radius-sm: 5px;
      --radius-lg: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--bg-root);
      color: var(--text-primary);
      line-height: 1.55;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--accent); color: #fff; }

    .page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.35;
      mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black, transparent);
    }

    .form-card {
      position: relative;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 2.5rem;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 400px;
      animation: fadeUp 0.5s ease;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      justify-content: center;
      margin-bottom: 0.25rem;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: var(--accent);
      color: #fff;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.5px;
    }

    .logo-text {
      font-weight: 700;
      font-size: 20px;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 2rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    label {
      display: block;
      margin-bottom: 1rem;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    input[type="email"],
    input[type="password"] {
      display: block;
      width: 100%;
      padding: 0.6rem 0.75rem;
      margin-top: 0.4rem;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: var(--font-body);
      color: var(--text-primary);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    input::placeholder { color: var(--text-muted); }

    .btn {
      width: 100%;
      padding: 0.7rem;
      margin-top: 0.5rem;
      font-size: 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      border-radius: var(--radius);
      letter-spacing: -0.2px;
      transition: all 0.15s ease;
      border: none;
      cursor: pointer;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .error {
      background: var(--danger-dim);
      color: var(--danger);
      padding: 0.65rem 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      font-size: 13px;
    }

    .success {
      background: var(--accent-dim);
      color: var(--accent);
      padding: 0.65rem 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="bg-grid"></div>
    <form class="form-card" id="form">
      <div class="logo">
        <div class="logo-mark">TS</div>
        <span class="logo-text">Astrodock</span>
      </div>
      <p class="subtitle">Change Password</p>
      <div id="message"></div>
      <label>
        Email
        <input type="email" id="email" required autofocus placeholder="you@example.com">
      </label>
      <label>
        Current Password
        <input type="password" id="currentPassword" required placeholder="Enter current password">
      </label>
      <label>
        New Password
        <input type="password" id="newPassword" required placeholder="At least 8 characters" minlength="8">
      </label>
      <label>
        Confirm New Password
        <input type="password" id="confirmPassword" required placeholder="Re-enter new password" minlength="8">
      </label>
      <button type="submit" class="btn" id="submitBtn">Update Password</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('message');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.innerHTML = '';

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        msg.innerHTML = '<div class="error">New passwords do not match.</div>';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        const res = await fetch('/account/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            currentPassword: document.getElementById('currentPassword').value,
            newPassword
          })
        });

        const data = await res.json();

        if (!res.ok) {
          msg.innerHTML = `<div class="error">${data.error}</div>`;
        } else {
          msg.innerHTML = `<div class="success">${data.message}</div>`;
          form.reset();
        }
      } catch {
        msg.innerHTML = '<div class="error">Something went wrong. Please try again.</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
