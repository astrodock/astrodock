<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — Astrodock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-root: #f4f5f7;
      --bg-surface: #ffffff;
      --bg-input: #f7f8fa;
      --border: #d8dbe0;
      --text-primary: #1a1d23;
      --text-secondary: #5a5f6b;
      --text-muted: #8b919e;
      --accent: #0d9668;
      --accent-dim: rgba(13, 150, 104, 0.08);
      --accent-hover: #0b7f58;
      --danger: #dc2626;
      --danger-dim: rgba(220, 38, 38, 0.07);
      --font-body: 'DM Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --radius: 8px;
      --radius-sm: 5px;
      --radius-lg: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--bg-root);
      color: var(--text-primary);
      line-height: 1.55;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--accent); color: #fff; }

    .page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.35;
      mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black, transparent);
    }

    .form-card {
      position: relative;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 2.5rem;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 400px;
      animation: fadeUp 0.5s ease;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      justify-content: center;
      margin-bottom: 0.25rem;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: var(--accent);
      color: #fff;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.5px;
    }

    .logo-text {
      font-weight: 700;
      font-size: 20px;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 2rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    label {
      display: block;
      margin-bottom: 1rem;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    input[type="email"],
    input[type="password"] {
      display: block;
      width: 100%;
      padding: 0.6rem 0.75rem;
      margin-top: 0.4rem;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: var(--font-body);
      color: var(--text-primary);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    input::placeholder { color: var(--text-muted); }

    .btn {
      width: 100%;
      padding: 0.7rem;
      margin-top: 0.5rem;
      font-size: 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      border-radius: var(--radius);
      letter-spacing: -0.2px;
      transition: all 0.15s ease;
      border: none;
      cursor: pointer;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .error {
      background: var(--danger-dim);
      color: var(--danger);
      padding: 0.65rem 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      font-size: 13px;
    }

    .success {
      background: var(--accent-dim);
      color: var(--accent);
      padding: 0.65rem 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      font-size: 13px;
    }

    /* The signed-in panel. Hidden until /account/me answers, because this page
       is also reachable by someone who has only their password. */
    #signedIn { display: none; }
    .acct-who { font-size: 13px; color: var(--text-muted, #64748b); margin: 0 0 1.5rem; }
    .acct-who b { color: var(--text, #0f172a); }
    .sec { border-top: 1px solid var(--border); padding-top: 1.4rem; margin-top: 1.4rem; }
    .sec h3 { font-size: 13px; font-weight: 650; margin: 0 0 .3rem; letter-spacing: -.1px; }
    .sec p { font-size: 12.5px; color: var(--text-muted, #64748b); margin: 0 0 .9rem; line-height: 1.5; }
    .btn.ghost { background: transparent; border: 1px solid var(--border);
      color: var(--text, #0f172a); font-weight: 550; }
    .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
    .acct-row { display: flex; align-items: center; gap: .6rem; font-size: 13px; margin-bottom: .8rem; }
    .acct-row .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: #16a34a; }
    .acct-row .dot.off { background: var(--border); }
    a.btn { display: block; text-align: center; text-decoration: none; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="page">
    <div class="bg-grid"></div>
    <form class="form-card" id="form">
      <div class="logo">
        <div class="logo-mark">TS</div>
        <span class="logo-text">Astrodock</span>
      </div>
      <div id="message"></div>

      <div id="signedIn">
        <p class="acct-who">Signed in as <b id="acctEmail"></b></p>

        <div class="sec" id="googleSec">
          <h3>Sign in with Google</h3>
          <div class="acct-row"><span class="dot off" id="gDot"></span><span id="gState"></span></div>
          <p id="gHelp"></p>
          <a class="btn ghost" id="gLink" href="/account/google/link">Attach my Google account</a>
          <button type="button" class="btn ghost" id="gUnlink" style="display:none">Detach it</button>
        </div>

        <div class="sec">
          <h3>Sign-in address</h3>
          <p>Changing it sends a link to the new address. Nothing changes until you follow it.</p>
          <label>
            New address
            <input type="email" id="newEmail" placeholder="you@example.com">
          </label>
          <button type="button" class="btn ghost" id="emailBtn">Send the confirmation link</button>
        </div>

        <div class="sec"><h3>Change password</h3></div>
      </div>

      <p class="subtitle" id="pwTitle">Change Password</p>
      <label>
        Email
        <input type="email" id="email" required autofocus placeholder="you@example.com">
      </label>
      <label>
        Current Password
        <input type="password" id="currentPassword" required placeholder="Enter current password">
      </label>
      <label>
        New Password
        <input type="password" id="newPassword" required placeholder="At least 8 characters" minlength="8">
      </label>
      <label>
        Confirm New Password
        <input type="password" id="confirmPassword" required placeholder="Re-enter new password" minlength="8">
      </label>
      <button type="submit" class="btn" id="submitBtn">Update Password</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('message');
    const btn = document.getElementById('submitBtn');
    const show = (kind, text) => { msg.innerHTML = `<div class="${kind}">${text}</div>`; };

    // What this page can offer depends on whether a platform session exists.
    // With one, the address and the attached Google account are editable here.
    // Without, it is the password form it has always been — which is what
    // somebody who arrives holding only their password needs.
    let me = null;
    (async function load() {
      try {
        const r = await fetch('/account/me');
        if (!r.ok) return;
        me = await r.json();
      } catch { return; }

      document.getElementById('signedIn').style.display = 'block';
      document.getElementById('pwTitle').style.display = 'none';
      document.getElementById('acctEmail').textContent = me.email;

      const email = document.getElementById('email');
      email.value = me.email;
      email.readOnly = true;

      if (new URLSearchParams(location.search).get('linked')) {
        show('success', 'That Google account is attached. You can sign in with it from now on.');
        history.replaceState(null, '', location.pathname);
      }
      if (me.pendingEmail) {
        show('success', `Waiting for ${me.pendingEmail} to confirm. Until then you sign in as ${me.email}.`);
      }

      const sec = document.getElementById('googleSec');
      if (!me.googleAvailable) {
        sec.querySelector('#gState').textContent = 'Not set up on this server';
        sec.querySelector('#gHelp').textContent = 'An administrator has to configure Google sign-in before this can be used.';
        sec.querySelector('#gLink').style.display = 'none';
        return;
      }
      const dot = document.getElementById('gDot');
      const state = document.getElementById('gState');
      const help = document.getElementById('gHelp');
      if (me.google.linked) {
        dot.className = 'dot';
        state.textContent = me.google.email ? `Attached — ${me.google.email}` : 'Attached';
        help.textContent = me.hasPassword || me.passkeys
          ? 'You can sign in with either this or your password.'
          : 'This is currently the only way into your account.';
        document.getElementById('gLink').style.display = 'none';
        document.getElementById('gUnlink').style.display = 'block';
      } else {
        state.textContent = 'Not attached';
        help.textContent = 'It does not have to be the same address as above — whichever Google account you pick becomes a way in.';
      }
    })();

    document.getElementById('gUnlink')?.addEventListener('click', async (e) => {
      e.target.disabled = true;
      try {
        const r = await fetch('/account/google/unlink', { method: 'POST' });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        show('success', d.message);
        setTimeout(() => location.reload(), 900);
      } catch (ex) {
        show('error', ex.message || 'That did not work.');
        e.target.disabled = false;
      }
    });

    document.getElementById('emailBtn')?.addEventListener('click', async (e) => {
      const value = document.getElementById('newEmail').value.trim();
      if (!value) return show('error', 'Enter the address you want to use.');
      e.target.disabled = true;
      try {
        const r = await fetch('/account/email', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: value })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        show('success', d.message);
        document.getElementById('newEmail').value = '';
      } catch (ex) {
        show('error', ex.message || 'That did not work.');
      }
      e.target.disabled = false;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.innerHTML = '';

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        msg.innerHTML = '<div class="error">New passwords do not match.</div>';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        const res = await fetch('/account/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            currentPassword: document.getElementById('currentPassword').value,
            newPassword
          })
        });

        const data = await res.json();

        if (!res.ok) {
          msg.innerHTML = `<div class="error">${data.error}</div>`;
        } else {
          msg.innerHTML = `<div class="success">${data.message}</div>`;
          form.reset();
        }
      } catch {
        msg.innerHTML = '<div class="error">Something went wrong. Please try again.</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
