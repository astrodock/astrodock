<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrodock — Apps (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --space-0:#06090f; --space-1:#0a0e15; --panel:#0f141d; --panel-2:#141b26;
  --line:#222d3b; --line-soft:#19212c; --field:#0c121b;
  --ink:#f1f5fa; --ink-2:#b6c4d4; --ink-3:#8595a8;
  --nominal:#2fe6a8; --amber:#ffbe5c; --critical:#ff6573; --cyan:#5ad3ff;
  --nominal-dim:rgba(47,230,168,.11); --amber-dim:rgba(255,190,92,.13); --critical-dim:rgba(255,101,115,.13); --cyan-dim:rgba(90,211,255,.13);
  --display:'Saira',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace; --r:14px; --r-sm:9px; --signal:var(--nominal); --signal-dim:var(--nominal-dim);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--display); background:var(--space-1); color:var(--ink); font-size:14.5px; line-height:1.55; -webkit-font-smoothing:antialiased; overflow-x:hidden}
.bg{position:fixed; inset:0; z-index:0; pointer-events:none}
.bg-stars{position:absolute; inset:0; opacity:.4; background-image:radial-gradient(1px 1px at 20% 30%,#cfe3ff55,transparent),radial-gradient(1px 1px at 80% 20%,#bcd6ff44,transparent),radial-gradient(1px 1px at 65% 60%,#ffffff2a,transparent),radial-gradient(1px 1px at 35% 75%,#cfe3ff44,transparent)}
.bg-glow{position:absolute; top:-360px; left:60%; width:1000px; height:680px; border-radius:50%; filter:blur(110px); opacity:.26; background:radial-gradient(circle,var(--signal-dim),transparent 62%)}
.bg-vignette{position:absolute; inset:0; background:radial-gradient(ellipse 120% 90% at 50% -10%,transparent 55%,#0008 100%)}
.app{position:relative; z-index:1; display:flex; min-height:100vh}
.sidebar{width:240px; flex-shrink:0; position:fixed; inset:0 auto 0 0; background:linear-gradient(180deg,var(--space-0),var(--space-1)); border-right:1px solid var(--line-soft); display:flex; flex-direction:column; z-index:20}
.brand{display:flex; align-items:center; gap:11px; padding:20px 20px 18px}
.mark .orbit-dot{transform-origin:17px 17px; animation:orbit 6s linear infinite} @keyframes orbit{to{transform:rotate(360deg)}}
.brand-name{font-weight:700; font-size:16px; letter-spacing:.6px} .brand-name b{color:var(--ink)} .brand-name span{color:var(--ink-3); font-weight:500}
.brand-sub{font-family:var(--mono); font-size:9.5px; letter-spacing:2.5px; color:var(--ink-3); text-transform:uppercase; margin-top:1px}
nav{padding:8px 12px; display:flex; flex-direction:column; gap:2px; flex:1}
.nav-sec{font-family:var(--mono); font-size:9px; letter-spacing:2px; color:var(--ink-3); text-transform:uppercase; padding:14px 10px 6px; opacity:.7}
.nav-item{display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:var(--r-sm); color:var(--ink-2); text-decoration:none; font-size:14px; font-weight:500; position:relative; transition:.15s}
.nav-item svg{width:16px; height:16px; opacity:.6; flex-shrink:0}
.nav-item:hover{background:#ffffff0a; color:var(--ink)}
.nav-item.on{background:var(--signal-dim); color:var(--signal)} .nav-item.on svg{opacity:1}
.nav-item.on::before{content:""; position:absolute; left:-12px; top:9px; bottom:9px; width:3px; background:var(--signal); border-radius:0 3px 3px 0; box-shadow:0 0 10px var(--signal)}
.sys-chip{margin:12px; padding:12px 14px; border:1px solid var(--line-soft); border-radius:var(--r-sm); background:#0c1119; display:flex; align-items:center; gap:10px}
.sys-chip .led{width:9px; height:9px} .sys-chip .t{font-size:12px} .sys-chip .t b{display:block; font-weight:600} .sys-chip .t span{font-family:var(--mono); font-size:10px; color:var(--ink-3)}
.deck{flex:1; margin-left:240px; padding:24px 40px 60px}
.topbar{display:flex; align-items:center; gap:14px; margin-bottom:18px}
.crumb{font-family:var(--mono); font-size:11px; letter-spacing:3px; color:var(--ink-3); text-transform:uppercase}
.topbar .spacer{flex:1} .clock{font-family:var(--mono); font-size:12px; color:var(--ink-2)} .clock b{color:var(--ink)}
.page-header{display:flex; align-items:center; gap:16px; margin-bottom:6px}
.page-header h1{font-size:28px; font-weight:700; letter-spacing:-.5px}
.page-header .spacer{flex:1}
.summary{font-family:var(--mono); font-size:12.5px; color:var(--ink-3); margin-bottom:22px}
.summary b{color:var(--ink-2)} .summary .sep{margin:0 9px; opacity:.5}
.led{width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0}
.led.ok{background:var(--nominal); box-shadow:0 0 8px var(--nominal)} .led.run{background:var(--cyan); box-shadow:0 0 8px var(--cyan)}
.led.inactive{background:var(--ink-3)} .led.crit{background:var(--critical); box-shadow:0 0 9px var(--critical); animation:alarm 1.1s ease-in-out infinite}
@keyframes alarm{50%{opacity:.4}}
button.btn{font-family:var(--display); font-size:13.5px; font-weight:600; border-radius:var(--r-sm); padding:10px 18px; cursor:pointer; background:var(--signal); color:#06120d; border:0}
button.btn:hover{background:#13c98c}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px}
.appcard{border:1px solid var(--line); border-left:3px solid var(--line); border-radius:var(--r); background:linear-gradient(150deg,var(--panel),#0c111a); padding:18px 20px; cursor:pointer; transition:.2s}
.appcard:hover{transform:translateY(-2px)}
.appcard.running{border-left-color:var(--nominal)} .appcard.running:hover{border-color:#33445a}
.appcard.building{border-left-color:var(--cyan); background:linear-gradient(150deg,rgba(90,211,255,.07),var(--panel))}
.appcard.stopped{opacity:.56; border-left-color:var(--ink-3)} .appcard.stopped:hover{opacity:.9}
.appcard.down{border-color:var(--critical); border-left-color:var(--critical); background:linear-gradient(150deg,rgba(255,101,115,.10),var(--panel)); box-shadow:0 0 0 3px var(--critical-dim)}
.ac-top{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.ac-name{font-size:18px; font-weight:600; letter-spacing:-.2px}
.statusbadge{margin-left:auto; font-family:var(--mono); font-size:10px; letter-spacing:.6px; text-transform:uppercase; padding:4px 11px; border-radius:20px; font-weight:600; display:inline-flex; align-items:center; gap:6px}
.statusbadge.running{color:var(--nominal); background:var(--nominal-dim)}
.statusbadge.building{color:var(--cyan); background:var(--cyan-dim)}
.statusbadge.stopped{color:var(--ink-3); background:#ffffff0a}
.statusbadge.down{color:#fff; background:var(--critical); box-shadow:0 0 14px rgba(255,101,115,.5)}
.ac-hostrow{display:flex; align-items:center; gap:10px; margin-bottom:16px}
.rt{font-family:var(--mono); font-size:10px; letter-spacing:.5px; color:var(--ink-3); border:1px solid var(--line); border-radius:5px; padding:2px 8px; flex-shrink:0}
.ac-host{display:inline-flex; align-items:center; gap:6px; color:var(--cyan); font-family:var(--mono); font-size:12px; text-decoration:none}
.ac-host:hover{text-decoration:underline}
.ac-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:14px 0; border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft)}
.ac-stats label{display:block; font-family:var(--mono); font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-3); margin-bottom:5px}
.ac-stats b{font-size:15px; font-weight:600; font-variant-numeric:tabular-nums}
.s-ok{color:var(--nominal)} .s-run{color:var(--cyan)} .s-down{color:var(--critical)} .s-stop{color:var(--ink-3)}
.ac-foot{display:flex; align-items:center; gap:8px; margin-top:14px; font-size:12.5px; color:var(--ink-3)}
.ac-foot .by{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); background:#ffffff08; border:1px solid var(--line-soft); padding:2px 8px; border-radius:20px; margin-left:auto}
.runspin{width:12px;height:12px;border:1.6px solid var(--cyan);border-top-color:transparent;border-radius:50%;display:inline-block;animation:orbit .8s linear infinite;vertical-align:-2px;margin-right:6px}
.tag-proto{position:fixed; bottom:14px; right:16px; z-index:30; font-family:var(--mono); font-size:10px; letter-spacing:1px; color:var(--ink-3); background:#0c1119cc; border:1px solid var(--line); padding:5px 10px; border-radius:20px; backdrop-filter:blur(6px)}
@media(max-width:980px){ .sidebar{transform:translateX(-100%)} .deck{margin-left:0} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="bg"><div class="bg-glow"></div><div class="bg-stars"></div><div class="bg-vignette"></div></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="mark"><svg width="34" height="34" viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="15" stroke="var(--signal)" stroke-width="1.4" opacity=".4"/><circle cx="17" cy="17" r="9.5" stroke="var(--signal)" stroke-width="1.4" opacity=".7"/><circle cx="17" cy="17" r="3.6" fill="var(--signal)"/><g class="orbit-dot"><circle cx="32" cy="17" r="2.3" fill="var(--ink)"/></g></svg></div>
      <div><div class="brand-name"><b>ASTRO</b><span>DOCK</span></div><div class="brand-sub">control plane</div></div></div>
    <nav>
      <div class="nav-sec">Operate</div>
      <a class="nav-item" href="overview.html"><svg viewBox="0 0 16 16" fill="none"><path d="M2 9.5 8 3l6 6.5M4 8.5V14h8V8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Overview</a>
      <a class="nav-item on" href="apps.html"><svg viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="9.5" y="1.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="1.5" y="9.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="9.5" y="9.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>Apps</a>
      <a class="nav-item" href="#"><svg viewBox="0 0 16 16" fill="none"><path d="M3 1.5h6L13 5v9.5H3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Pages</a>
      <a class="nav-item" href="#"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M2 14c0-3 2.5-5 6-5s6 2 6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Users</a>
      <div class="nav-sec">Network &amp; access</div>
      <a class="nav-item" href="domains.html"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.3" stroke="currentColor" stroke-width="1.5"/><path d="M1.7 8h12.6M8 1.7c1.8 2 1.8 10.6 0 12.6M8 1.7c-1.8 2-1.8 10.6 0 12.6" stroke="currentColor" stroke-width="1.2"/></svg>Domains</a>
      <a class="nav-item" href="#"><svg viewBox="0 0 16 16" fill="none"><circle cx="5" cy="8" r="3.2" stroke="currentColor" stroke-width="1.5"/><path d="M8 8h6.5M12.5 8v2.3M10.5 8v1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Access keys</a>
      <div class="nav-sec">Observe</div>
      <a class="nav-item" href="#"><svg viewBox="0 0 16 16" fill="none"><path d="M2 8h2l2-4 4 8 2-4h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Activity</a>
      <a class="nav-item" href="#"><svg viewBox="0 0 16 16" fill="none"><path d="M8 14s-5.5-3.5-5.5-7.5a3.5 3.5 0 0 1 7 0 3.5 3.5 0 0 1 7 0C13.5 10.5 8 14 8 14z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Health</a>
      <a class="nav-item" href="settings.html"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Settings</a>
    </nav>
    <div class="sys-chip"><span class="led ok"></span><div class="t"><b>Nominal</b><span>box-01 · localhost</span></div></div>
  </aside>

  <main class="deck">
    <div class="topbar"><span class="crumb">Mission · Apps</span><span class="spacer"></span><span class="clock"><b id="clk">--:--:--</b> UTC</span></div>
    <div class="page-header"><h1>Apps</h1><span class="spacer"></span><button class="btn">+ New app</button></div>
    <div class="summary" id="summary"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>
<div class="tag-proto">PROTOTYPE · apps · orbital mission control</div>

<script>
const APPS=[
  {name:'blog', rt:'Node', status:'running', host:'blog.acme.com', resp:'41 ms', mem:'96 MB', deploy:'2m ago', by:'GitHub push', db:'Postgres', auth:'Platform'},
  {name:'notes', rt:'Node', status:'running', host:'notes.example.com', resp:'38 ms', mem:'72 MB', deploy:'1d ago', by:'paul@…', db:'Postgres', auth:'Platform'},
  {name:'api', rt:'Node', status:'building', host:'api.example.com', deploy:'now', by:'claude-agent · CLI'},
  {name:'shop', rt:'Docker', status:'running', host:'shop.io', resp:'55 ms', mem:'210 MB', deploy:'8m ago', by:'GitHub push', db:'External', auth:'Public'},
  {name:'analytics', rt:'Node', status:'stopped', host:'analytics.example.com', deploy:'5d ago', by:'paul@…', db:'Postgres', auth:'Platform'},
  {name:'newsletter', rt:'Node', status:'down', host:'news.example.com', resp:'—', mem:'—', deploy:'3h ago', by:'GitHub push', db:'Postgres', auth:'Platform'},
];
const STATUS={
  running:{led:'ok', label:'Running', cls:'s-ok'},
  building:{led:'run', label:'Deploying', cls:'s-run'},
  stopped:{led:'inactive', label:'Stopped', cls:'s-stop'},
  down:{led:'crit', label:'Down', cls:'s-down'},
};
const RANK={down:0, building:1, running:2, stopped:3};
function badge(a){
  if(a.status==='building') return '<span class="runspin"></span> Deploying';
  if(a.status==='down') return 'Down';
  if(a.status==='stopped') return 'Stopped';
  return 'Running';
}
function render(){
  const running=APPS.filter(a=>a.status==='running').length, building=APPS.filter(a=>a.status==='building').length, down=APPS.filter(a=>a.status==='down').length, stopped=APPS.filter(a=>a.status==='stopped').length;
  document.getElementById('summary').innerHTML=`<b>${APPS.length}</b> apps <span class="sep">·</span> <b style="color:${down?'var(--critical)':'var(--ink-2)'}">${down}</b> down <span class="sep">·</span> <b>${building}</b> deploying <span class="sep">·</span> <b>${running}</b> running <span class="sep">·</span> <b>${stopped}</b> stopped`;
  const sorted=[...APPS].sort((a,b)=>RANK[a.status]-RANK[b.status]);
  document.getElementById('grid').innerHTML=sorted.map(a=>{ const s=STATUS[a.status]; return `
    <div class="appcard ${a.status}">
      <div class="ac-top"><span class="led ${s.led}"></span><span class="ac-name">${a.name}</span><span class="statusbadge ${a.status}">${badge(a)}</span></div>
      <div class="ac-hostrow"><span class="rt">${a.rt}</span><a class="ac-host" onclick="event.stopPropagation()">${a.host} <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M6 3H3a1 1 0 00-1 1v9a1 1 0 001 1h9a1 1 0 001-1v-3M9 2h5v5M15 1L8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>
      <div class="ac-stats">
        <div><label>Response</label><b>${a.resp||'—'}</b></div>
        <div><label>Memory</label><b>${a.mem||'—'}</b></div>
        <div><label>Last deploy</label><b style="font-weight:500;font-size:13.5px">${a.status==='building'?'now':a.deploy}</b></div>
      </div>
      <div class="ac-foot">Deployed <span class="by">by ${a.by}</span></div>
    </div>`; }).join('');
}
function tick(){ document.getElementById('clk').textContent=new Date().toISOString().slice(11,19); }
setInterval(tick,1000); tick(); render();
</script>
</body>
</html>
