<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astrodock Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- set theme before paint to avoid a flash -->
    <script>
      (function(){ try { document.documentElement.dataset.theme = localStorage.getItem('astrodock_theme') || 'dark'; } catch(e) { document.documentElement.dataset.theme = 'dark'; } })();
    </script>
    <style>html{background:#0a0e15}html[data-theme="light"]{background:#f4f6fa}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
