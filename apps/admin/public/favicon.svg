<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Astrodock">
  <!-- The docking mark: a ring with a craft on approach, breaking the ring where
       it arrives. Weights are deliberately heavy — the concentric hairlines of
       the in-app logo turn to mush at 16px, which is where a favicon lives. -->
  <defs>
    <linearGradient id="ad-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AF0B2"/>
      <stop offset="1" stop-color="#0E9E6E"/>
    </linearGradient>
    <mask id="ad-gate">
      <rect width="64" height="64" fill="#fff"/>
      <!-- punches the approach gate out of the ring -->
      <circle cx="45.5" cy="18.5" r="9.5" fill="#000"/>
    </mask>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#ad-tile)"/>
  <circle cx="32" cy="32" r="17.5" fill="none" stroke="#06131A" stroke-width="5.5" mask="url(#ad-gate)"/>
  <circle cx="32" cy="32" r="6.5" fill="#06131A"/>
  <circle cx="45.5" cy="18.5" r="5" fill="#06131A"/>
</svg>
