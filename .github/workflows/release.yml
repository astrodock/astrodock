# Publish the Astrodock image so a server can run the platform without a source
# tree or a build toolchain (see scripts/install.sh). One image serves both the
# api and runner roles — they differ only by ASTRODOCK_ROLE at runtime.
#
# Triggered by a version tag (v1.2.3) or by hand. Nothing is published on a normal
# push to main: `latest` should mean "the last release", not "the last commit".
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The input reaches the shell through the environment, never pasted into
      # the script, and must look like a version. A run started by hand must be
      # on that version's tag, so `latest` only ever comes from a tagged commit.
      - name: Resolve version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_TAG"
            if [ "$GITHUB_REF" != "refs/tags/$VERSION" ]; then
              echo "::error::Run this from the tag $VERSION (Use workflow from: $VERSION), not from $GITHUB_REF."
              exit 1
            fi
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$VERSION is not a version tag like v1.2.3."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The package versions drifted nine releases behind the tags before anyone
      # noticed, which meant `astrodock --version` and a source build both
      # reported 0.0.6 while the platform was on 0.0.15. Refuse to publish a
      # release whose version nobody remembered to write down.
      - name: Tag and package.json must agree
        run: |
          set -eu
          TAG="${{ steps.v.outputs.version }}"
          PKG=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG."
            echo "Bump every package.json to ${TAG#v} and commit before tagging."
            exit 1
          fi
          echo "tag $TAG matches package.json $PKG"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/control-plane/Dockerfile
          # arm64 matters here: Ampere/Graviton droplets are the cheap tier, and a
          # single-arch image would silently exclude them.
          platforms: linux/amd64,linux/arm64
          push: true
          # Baked in so the running platform can report what it is, and so the
          # update check has something real to compare against.
          build-args: |
            ASTRODOCK_BUILD_VERSION=${{ steps.v.outputs.version }}
            ASTRODOCK_BUILD_COMMIT=${{ github.sha }}
            ASTRODOCK_BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image
        # Catches the failure mode that matters most for a one-line installer: an
        # image that pulls fine but cannot start. Runs the real entrypoint far
        # enough to prove the app loads, without needing Postgres.
        run: |
          docker run --rm --entrypoint node \
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }} \
            -e "require('/app/apps/control-plane/server.js');
                require('/app/apps/control-plane/src/runner/server.js');
                console.log('image OK: control plane + runner both load')"

  # The CLI and the app.json schema it validates against, so `npx @astrodock/cli`
  # works on a machine with no checkout. Off until an NPM_TOKEN secret exists:
  # the job then says so and stops, rather than failing the release.
  npm:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish @astrodock/schema and @astrodock/cli
        run: |
          set -eu
          if [ -z "$NPM_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set, so nothing was published to npm."
            exit 0
          fi
          # Schema first: the CLI depends on it.
          npm publish -w @astrodock/schema --access public --provenance
          npm publish -w @astrodock/cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
