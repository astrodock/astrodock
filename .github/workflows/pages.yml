# Publish docs/ to GitHub Pages.
#
# The docs have always been a static site with no build step — plain HTML, one CSS
# file, one JS file, all relative links — so this just uploads the folder. Relative
# links mean it works unchanged from a project subpath
# (astrodock.github.io/astrodock/) or from a custom domain later.
#
# One manual step before the first run: Settings → Pages → Source → GitHub Actions.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two doc deploys race; skip superseded ones rather than queueing them.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken internal links
        # The docs are hand-written HTML with relative hrefs, so a renamed page
        # breaks links silently. Cheap to catch here rather than in someone's face.
        run: |
          set -eu
          missing=0
          cd docs
          for f in *.html; do
            for href in $(grep -oE 'href="[a-z0-9-]+\.html"' "$f" | sed 's/href="//;s/"//' | sort -u); do
              [ -f "$href" ] || { echo "$f links to missing $href"; missing=1; }
            done
          done
          [ "$missing" = 0 ] || exit 1
          echo "all internal doc links resolve"

      # configure-pages fails with an opaque error when Pages has never been
      # switched on for the repository, which is a one-time setting in the web UI
      # that no workflow can make for you. Say so, rather than leaving a red X
      # that reads like the docs themselves are broken.
      - name: Is GitHub Pages switched on?
        run: |
          set -eu
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "404" ]; then
            echo "::error::GitHub Pages is not enabled for this repository."
            echo ""
            echo "  Settings -> Pages -> Build and deployment -> Source: GitHub Actions"
            echo ""
            echo "It is a one-time switch that has to be made in the web UI; no"
            echo "workflow can turn it on for you. Everything else here passed —"
            echo "the docs built and every internal link resolves."
            exit 1
          fi
          echo "Pages is enabled (API answered $code)."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
