# Astrodock — the whole platform as one stack. `docker compose up -d` and you have
# a control plane + admin UI + auto-HTTPS routing + bundled Postgres + bundled
# object storage, with zero external dependencies.
#
# The project name `astrodock` fixes the default network name `astrodock_default`,
# which the runner attaches Dockerfile-app sibling containers to.
name: astrodock

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ASTRODOCK_PG_USER:-astrodock}
      POSTGRES_PASSWORD: ${ASTRODOCK_PG_PASSWORD:?set ASTRODOCK_PG_PASSWORD in .env}
      POSTGRES_DB: ${ASTRODOCK_PG_DATABASE:-astrodock}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ASTRODOCK_PG_USER:-astrodock}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  objectstore:
    image: chrislusf/seaweedfs:3.80
    # S3-compatible store on :8333. Reachable only on the internal network.
    # See SECURITY.md for the v1 storage isolation note.
    command: "server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=1024"
    volumes:
      - objectdata:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - static:/srv/static
      - caddy_data:/data
      - caddy_config:/config
      - caddylogs:/var/log/caddy      # per-app access logs (opt-in via Settings)
    restart: unless-stopped

  api:
    # Prebuilt image, so a fresh server never needs the source tree or a toolchain.
    # Building from source instead:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ${ASTRODOCK_IMAGE:-ghcr.io/astrodock/astrodock}:${ASTRODOCK_VERSION:-latest}
    env_file:
      - .env
    environment:
      # The control plane holds NO Docker socket and NO GitHub PAT (those live in the runner).
      PORT: "3100"
      ASTRODOCK_ROLE: control-plane
      ASTRODOCK_GITHUB_PAT: ""                 # explicitly blanked on the api
      ASTRODOCK_RUNNER_URL: http://runner:3200
      ASTRODOCK_RUNNER_TOKEN: "${ASTRODOCK_RUNNER_TOKEN:-change-me-runner-shared-token}"
      ASTRODOCK_PG_HOST: postgres
      ASTRODOCK_PG_PORT: "5432"
      ASTRODOCK_PG_APP_HOST: postgres
      ASTRODOCK_PG_APP_PORT: "5432"
      ASTRODOCK_OBJECTSTORE_ENDPOINT: http://objectstore:8333
      ASTRODOCK_OBJECTSTORE_APP_ENDPOINT: http://objectstore:8333
      ASTRODOCK_CADDY_ADMIN: http://caddy:2019
      ASTRODOCK_INTERNAL_AUTH_URL: http://api:3100
      ASTRODOCK_CADDY_STATIC_DIR: /srv/static
      ASTRODOCK_STATIC_DIR: /data/static
    volumes:
      - static:/data/static     # publishes the admin SPA into the shared static volume
      - caddylogs:/var/log/caddy:ro   # read deployed-app access logs back (opt-in)
    depends_on:
      postgres:
        condition: service_healthy
      caddy:
        condition: service_started
    restart: unless-stopped

  # The runner: owns the Docker socket, the GitHub PAT, PM2, and the build volumes.
  # Same image as api, started in the runner role. Reachable only on the internal network.
  runner:
    # Same image as api, started in the runner role (see ASTRODOCK_ROLE below).
    image: ${ASTRODOCK_IMAGE:-ghcr.io/astrodock/astrodock}:${ASTRODOCK_VERSION:-latest}
    env_file:
      - .env
    environment:
      ASTRODOCK_ROLE: runner
      ASTRODOCK_RUNNER_PORT: "3200"
      ASTRODOCK_RUNNER_TOKEN: "${ASTRODOCK_RUNNER_TOKEN:-change-me-runner-shared-token}"
      ASTRODOCK_PG_HOST: postgres
      ASTRODOCK_PG_PORT: "5432"
      ASTRODOCK_PG_APP_HOST: postgres
      ASTRODOCK_PG_APP_PORT: "5432"
      ASTRODOCK_OBJECTSTORE_ENDPOINT: http://objectstore:8333
      ASTRODOCK_OBJECTSTORE_APP_ENDPOINT: http://objectstore:8333
      ASTRODOCK_OBJECTSTORE_CONTAINER: astrodock-objectstore-1
      ASTRODOCK_INTERNAL_AUTH_URL: http://api:3100
      ASTRODOCK_DOCKER_NETWORK: astrodock_default
      ASTRODOCK_STATIC_DIR: /data/static
      ASTRODOCK_APPS_DIR: /data/apps
      ASTRODOCK_REPOS_DIR: /data/repos
    volumes:
      # Docker socket → build/run Dockerfile apps + mint object-store identities (≈ host root; see SECURITY.md)
      - /var/run/docker.sock:/var/run/docker.sock
      - static:/data/static
      - apps:/data/apps
      - repos:/data/repos
      - pm2home:/data/pm2
      - backups:/data/backups   # pg_dumpall output (scheduled + manual backups)
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  objectdata:
  static:
  apps:
  repos:
  pm2home:
  caddylogs:
  backups:
  caddy_data:
  caddy_config:
