# Astrodock — the whole platform as one stack. `docker compose up -d` and you have
# a control plane + admin UI + auto-HTTPS routing + bundled Postgres + bundled
# object storage, with zero external dependencies.
#
# The project name. Override with ASTRODOCK_PROJECT to run more than one Astrodock
# on a host — but note this also namespaces the VOLUMES, so a second project starts
# with an empty database. It is not a way to rename an existing install.
name: ${ASTRODOCK_PROJECT:-astrodock}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ASTRODOCK_PG_USER:-astrodock}
      POSTGRES_PASSWORD: ${ASTRODOCK_PG_PASSWORD:?set ASTRODOCK_PG_PASSWORD in .env}
      POSTGRES_DB: ${ASTRODOCK_PG_DATABASE:-astrodock}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ASTRODOCK_PG_USER:-astrodock}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Object storage, in two parts so apps can reach only the S3 API.
  #
  # `weed server` also runs a master, a volume server and a filer, and none of them
  # check credentials: the per-app S3 keys apply to the S3 gateway alone. When this
  # one container sat on the shared network, any app could skip its key and read
  # every bucket through the filer on :8888. So the storage core lives on an
  # internal network nothing else joins, and `objectstore` is an HTTP proxy that
  # forwards :8333 and nothing else. Apps keep the same address.
  seaweed:
    image: chrislusf/seaweedfs:3.80
    command: "server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=1024"
    volumes:
      - objectdata:/data
    networks:
      - storage
    restart: unless-stopped

  objectstore:
    image: caddy:2-alpine
    # Host is passed through unchanged (no --change-host-header), which S3
    # signatures depend on.
    command: ["caddy", "reverse-proxy", "--from", "http://:8333", "--to", "http://seaweed:8333"]
    networks:
      - default
      - storage
    depends_on:
      - seaweed
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - static:/srv/static
      - caddy_data:/data
      - caddy_config:/config
      - caddylogs:/var/log/caddy      # per-app access logs (opt-in via Settings)
      - caddy_admin:/run/caddy-admin  # admin API socket, shared with the api only
    # The admin API is a unix socket, not a port. On a port it was reachable from
    # every app on the shared network, and Caddy's origin check only reads a Host
    # header the caller chooses — any app could replace the routing for the admin
    # and auth hosts. A stale socket from the last run would block the bind.
    command: ["sh", "-c", "rm -f /run/caddy-admin/admin.sock; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    restart: unless-stopped

  api:
    # Prebuilt image, so a fresh server never needs the source tree or a toolchain.
    # Building from source instead:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ${ASTRODOCK_IMAGE:-ghcr.io/astrodock/astrodock}:${ASTRODOCK_VERSION:-latest}
    env_file:
      - .env
    environment:
      # The control plane holds NO Docker socket and NO GitHub PAT (those live in the runner).
      PORT: "3100"
      ASTRODOCK_ROLE: control-plane
      ASTRODOCK_GITHUB_PAT: ""                 # explicitly blanked on the api
      ASTRODOCK_RUNNER_URL: http://runner:3200
      ASTRODOCK_RUNNER_TOKEN: "${ASTRODOCK_RUNNER_TOKEN:?set ASTRODOCK_RUNNER_TOKEN in .env}"
      ASTRODOCK_PG_HOST: postgres
      ASTRODOCK_PG_PORT: "5432"
      ASTRODOCK_PG_APP_HOST: postgres
      ASTRODOCK_PG_APP_PORT: "5432"
      ASTRODOCK_OBJECTSTORE_ENDPOINT: http://objectstore:8333
      ASTRODOCK_OBJECTSTORE_APP_ENDPOINT: http://objectstore:8333
      ASTRODOCK_CADDY_ADMIN: unix:///run/caddy-admin/admin.sock
      ASTRODOCK_INTERNAL_AUTH_URL: http://api:3100
      ASTRODOCK_CADDY_STATIC_DIR: /srv/static
      ASTRODOCK_STATIC_DIR: /data/static
    volumes:
      - static:/data/static     # publishes the admin SPA into the shared static volume
      - caddylogs:/var/log/caddy:ro   # read deployed-app access logs back (opt-in)
      - caddy_admin:/run/caddy-admin  # Caddy admin API socket
    depends_on:
      postgres:
        condition: service_healthy
      caddy:
        condition: service_started
    restart: unless-stopped

  # The runner: owns the Docker socket, the GitHub PAT, PM2, and the build volumes.
  # Same image as api, started in the runner role. Reachable only on the internal network.
  runner:
    # Same image as api, started in the runner role (see ASTRODOCK_ROLE below).
    image: ${ASTRODOCK_IMAGE:-ghcr.io/astrodock/astrodock}:${ASTRODOCK_VERSION:-latest}
    env_file:
      - .env
    environment:
      ASTRODOCK_ROLE: runner
      ASTRODOCK_RUNNER_PORT: "3200"
      ASTRODOCK_RUNNER_TOKEN: "${ASTRODOCK_RUNNER_TOKEN:?set ASTRODOCK_RUNNER_TOKEN in .env}"
      ASTRODOCK_PG_HOST: postgres
      ASTRODOCK_PG_PORT: "5432"
      ASTRODOCK_PG_APP_HOST: postgres
      ASTRODOCK_PG_APP_PORT: "5432"
      ASTRODOCK_OBJECTSTORE_ENDPOINT: http://objectstore:8333
      ASTRODOCK_OBJECTSTORE_APP_ENDPOINT: http://objectstore:8333
      ASTRODOCK_INTERNAL_AUTH_URL: http://api:3100
      # Deliberately NOT set. The runner asks Docker which network it is actually on
      # (see src/runner/network.js) instead of being told a name that has to be kept
      # in step with the project name by hand. Naming the network here — or in a
      # `networks:` block — also breaks `docker compose -p` isolation: a second stack
      # would silently join the first one's network and collide on service names.
      # Set ASTRODOCK_DOCKER_NETWORK in .env only to override that detection.
      ASTRODOCK_STATIC_DIR: /data/static
      ASTRODOCK_APPS_DIR: /data/apps
      ASTRODOCK_REPOS_DIR: /data/repos
    volumes:
      # Docker socket → build/run Dockerfile apps + mint object-store identities (≈ host root; see SECURITY.md)
      - /var/run/docker.sock:/var/run/docker.sock
      - static:/data/static
      - apps:/data/apps
      - repos:/data/repos
      - pm2home:/data/pm2
      - backups:/data/backups   # pg_dumpall output (scheduled + manual backups)
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  objectdata:
  static:
  apps:
  repos:
  pm2home:
  caddylogs:
  backups:
  caddy_data:
  caddy_config:
  caddy_admin:

networks:
  # Storage core only. Not named, so `docker compose -p` still namespaces it.
  storage:
    internal: true
