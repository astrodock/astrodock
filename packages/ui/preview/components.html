<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components · Astrodock app design system</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="preview.css">
</head>
<body>
<main class="page page-wide">
  <a class="back" href="index.html"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>Overview</a>
  <div class="page-head">
    <div class="page-head-main"><div class="page-head-text">
      <div class="page-title-row"><h1 class="t-title">Components</h1></div>
      <p class="page-desc">Every part an app is built from, its examples, and when to use it. Each example's markup is the canonical markup: Show markup reveals it, and REFERENCE.md is built from this same catalog.</p>
    </div></div>
  </div>
  <div class="with-sidebar nav-side">
    <nav class="sidebar nav-list" id="catalog-nav" aria-label="Components"></nav>
    <div id="catalog"></div>
  </div>
</main>
<script src="catalog.js"></script>
<script>
  // Render the catalog. Each example shows its live markup and the same markup as text.
  (function () {
    const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const nav = document.getElementById('catalog-nav');
    const out = document.getElementById('catalog');
    let navHtml = '';
    let html = '';
    let n = 0;
    for (const g of window.KIT_CATALOG) {
      navHtml += `<span class="t-label">${g.group}</span>`;
      for (const c of g.components) {
        navHtml += `<a class="item" href="#${c.id}" data-target="${c.id}">${c.title}</a>`;
        html += `<section class="catalog-section" id="${c.id}">
          <h2 class="catalog-title">${c.title}</h2>
          <p class="catalog-lede">${c.lede}</p>
          ${c.use || c.notFor ? `<div class="catalog-use">
            ${c.use ? `<div><svg class="icon icon-sm text-success" aria-hidden="true"><use href="#i-check"/></svg><span><b>Use for</b> ${c.use}</span></div>` : ''}
            ${c.notFor ? `<div><svg class="icon icon-sm text-danger" aria-hidden="true"><use href="#i-x"/></svg><span><b>Not for</b> ${c.notFor}</span></div>` : ''}
          </div>` : ''}
          <div class="card">
            ${c.examples.map((ex) => {
              n += 1;
              return `<div class="specimen">
                <div class="specimen-label"><div class="t-subheading">${ex.title}</div>${ex.desc ? `<p>${ex.desc}</p>` : ''}
                  <button class="btn btn-sm btn-quiet" type="button" data-reveal="code-${n}" aria-expanded="false"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-chevron-right"/></svg><span data-reveal-label>Show markup</span></button></div>
                <div class="specimen-demo">${ex.html}
                  <div class="specimen-code" id="code-${n}" hidden><pre class="code-block">${esc(ex.html)}</pre><div class="actions mt-2"><button class="btn btn-sm" type="button" data-copy="code-${n}" data-toast="Markup copied"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-copy"/></svg>Copy</button></div></div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </section>`;
      }
    }
    nav.innerHTML = navHtml;
    out.innerHTML = html;
    document.addEventListener('click', (e) => {
      const b = e.target.closest('[data-copy]');
      if (b) navigator.clipboard?.writeText(document.querySelector(`#${b.dataset.copy} .code-block`).textContent);
    });
  })();
</script>
<script src="preview.js"></script>
</body>
</html>
